  <!-- Redirecionar WebView do Instagram/Facebook para navegador externo -->
  <script>
    (function () {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isInApp = /Instagram|FBAN|FBAV|FB_IAB|GSA/i.test(ua);

      if (isInApp) {
        const currentUrl = window.location.href;
        if (currentUrl.includes('instagram')) {
          // Para Instagram
          window.location = 'intent://raio-x.alemdodinheiro.net#Intent;scheme=https;package=com.android.chrome;end';
        } else {
          // Fallback - aviso ao usuário
          const div = document.createElement('div');
          div.innerHTML = '<div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 9999;"><div style="background: white; padding: 20px; border-radius: 10px; text-align: center;"><p style="margin: 0 0 10px 0; font-size: 16px; font-weight: bold;">Para melhor experiência</p><p style="margin: 0 0 20px 0; font-size: 14px;">Toque no botão abaixo para abrir no seu navegador</p><a href="' + currentUrl + '" style="display: inline-block; background: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold;">Abrir Navegador</a></div></div>';
          document.body.appendChild(div);
        }
      }
    })();
  </script>
